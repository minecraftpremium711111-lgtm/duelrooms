prefix: "&8[&cDuel&8] &7"
no-permission: "{prefix}&cYou do not have permission to do that."
player-only: "{prefix}&cThis command can only be used by players."
usage: "{prefix}&cUsage: &f{usage}"
invalid-number: "{prefix}&cThat is not a valid number."

# --- player messages ---
waiting: "{prefix}&eWaiting for an opponent..."
waiting-title: "&eWaiting..."
waiting-subtitle: "&7for an opponent"
waiting-timeout: "{prefix}&cNobody joined in time. You were sent out of the room."
opponent-found: "{prefix}&aOpponent found: &f{opponent}&a. Get ready!"
opponent-left: "{prefix}&eYour opponent left before the fight started."
countdown: "{prefix}&eDuel starts in &c{seconds}&e..."
countdown-title: "&c{seconds}"
countdown-subtitle: "&7Get ready!"
fight-start: "{prefix}&a&lFIGHT! &7The duel has started."
fight-title: "&a&lFIGHT!"
fight-subtitle: "&7Good luck!"
winner-self: "{prefix}&aYou won the duel! You have &e{time}s &ato loot. Use &f/spawn &ato leave early."
winner-title: "&a&lVICTORY"
winner-subtitle: "&7Loot within &e{time}s"
loser-self: "{prefix}&cYou lost the duel against &f{winner}&c."
winner-broadcast: "{prefix}&f{winner} &adefeated &f{loser} &ain &eDuel Room #{id}&a!"
looting-actionbar: "&6Looting time remaining: &e{time}s"
looting-end: "{prefix}&eYour looting time is over. Teleporting you out..."
left-room: "{prefix}&7You left the duel room."
not-in-room: "{prefix}&cYou are not in a duel room."
cannot-leave: "{prefix}&cYou cannot leave while the duel is in progress."
room-disabled: "{prefix}&cDuel Room #{id} is disabled."
room-occupied: "{prefix}&cDuel Room #{id} is occupied right now. Try another room."
room-not-configured: "{prefix}&cThis duel room is not fully set up yet."
room-closed: "{prefix}&eThe duel room was closed by an administrator."
teleport-blocked: "{prefix}&cYou cannot teleport while in a duel room."
command-blocked: "{prefix}&cYou cannot use that command during a duel."
no-leave-during-duel: "{prefix}&cYou cannot leave while the duel is in progress."
escape-blocked: "{prefix}&cYou cannot leave the duel room."
build-blocked: "{prefix}&cYou cannot build here."

# --- admin messages ---
room-created: "{prefix}&aCreated duel room &f{room} &7(#{id})&a. Now set spawn1, spawn2, entrance and exit."
room-exists: "{prefix}&cA room named &f{room} &calready exists."
room-deleted: "{prefix}&aDeleted duel room &f{room}&a."
room-not-found: "{prefix}&cNo duel room named &f{room}&c."
room-id-not-found: "{prefix}&cNo duel room with number &f{id}&c."
invalid-name: "{prefix}&cRoom names may only contain letters, numbers, '_' and '-' (max 32)."
location-set: "{prefix}&aSet &f{type} &afor room &f{room}&a."
different-world: "{prefix}&cBoth spawn points must be in the same world."
room-busy: "{prefix}&cThat room is currently in use."
admin-room-enabled: "{prefix}&aRoom &f{room} &aenabled."
admin-room-disabled: "{prefix}&eRoom &f{room} &edisabled."
room-list-header: "{prefix}&6Duel rooms:"
room-list-empty: "{prefix}&7There are no duel rooms yet."
room-list-entry: "&e#{id} &f{name} &8- {status} &8- {info}"
reloaded: "{prefix}&aConfiguration reloaded."
setting-updated: "{prefix}&aSetting &f{setting} &aof room &f{room} &anow: &f{value}"
hologram-created: "{prefix}&aHologram for room #{id} placed at your location."
hologram-removed: "{prefix}&aHologram #{id} removed."
hologram-not-found: "{prefix}&cNo hologram for room #{id}."
hologram-list-header: "{prefix}&6Holograms:"
hologram-list-empty: "{prefix}&7There are no holograms yet."
hologram-list-entry: "&e#{id} &8- &f{location}"
hologram-reloaded: "{prefix}&aHolograms reloaded."

help:
  - "&6&lDuelRooms &7- walk into a duel room entrance to play!"
  - "&e/duel leave &7- leave a room while waiting (or while looting as the winner)"
help-admin:
  - "&e/duel rooms create|delete <name>"
  - "&e/duel rooms setspawn1|setspawn2|setentrance|setexit <name>"
  - "&e/duel rooms enable|disable <name>"
  - "&e/duel rooms set <name> <countdown|looting> <seconds|reset>"
  - "&e/duel rooms list | reload"
  - "&e/duel rooms hologram <number> | remove <number> | list | reload"
